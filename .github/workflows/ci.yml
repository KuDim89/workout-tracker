name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint root
        run: pnpm lint:root

      - name: Typecheck root
        run: pnpm typecheck:root

      - name: Lint workspaces
        run: pnpm lint

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Build workspaces
        run: pnpm build

      - name: Test workspaces
        run: pnpm test
